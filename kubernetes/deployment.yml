apiVersion: v1
kind: Namespace
metadata:
  name: taskflow

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: taskflow-config
  namespace: taskflow
data:
  NEXTAUTH_URL: "https://taskflow.example.com"
  NEXT_PUBLIC_WS_URL: "wss://taskflow.example.com/ws"
  NODE_ENV: "production"
  WS_PORT: "3001"

---
apiVersion: v1
kind: Secret
metadata:
  name: taskflow-secrets
  namespace: taskflow
type: Opaque
stringData:
  DATABASE_URL: "postgresql://user:password@postgres:5432/taskmanagement?schema=public"
  NEXTAUTH_SECRET: "your-secret-key-here"
  POSTGRES_PASSWORD: "your-postgres-password"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-app
  namespace: taskflow
  labels:
    app: taskflow
    component: app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: taskflow
      component: app
  template:
    metadata:
      labels:
        app: taskflow
        component: app
    spec:
      containers:
      - name: app
        image: ghcr.io/your-org/task-management-app/app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: taskflow-secrets
              key: DATABASE_URL
        - name: NEXTAUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: taskflow-secrets
              key: NEXTAUTH_SECRET
        envFrom:
        - configMapRef:
            name: taskflow-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-websocket
  namespace: taskflow
  labels:
    app: taskflow
    component: websocket
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taskflow
      component: websocket
  template:
    metadata:
      labels:
        app: taskflow
        component: websocket
    spec:
      containers:
      - name: websocket
        image: ghcr.io/your-org/task-management-app/websocket:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3001
          name: websocket
        envFrom:
        - configMapRef:
            name: taskflow-config
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: taskflow-app
  namespace: taskflow
  labels:
    app: taskflow
    component: app
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: taskflow
    component: app

---
apiVersion: v1
kind: Service
metadata:
  name: taskflow-websocket
  namespace: taskflow
  labels:
    app: taskflow
    component: websocket
spec:
  type: ClusterIP
  ports:
  - port: 3001
    targetPort: 3001
    protocol: TCP
    name: websocket
  selector:
    app: taskflow
    component: websocket

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskflow-ingress
  namespace: taskflow
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/websocket-services: "taskflow-websocket"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - taskflow.example.com
    secretName: taskflow-tls
  rules:
  - host: taskflow.example.com
    http:
      paths:
      - path: /ws
        pathType: Prefix
        backend:
          service:
            name: taskflow-websocket
            port:
              number: 3001
      - path: /
        pathType: Prefix
        backend:
          service:
            name: taskflow-app
            port:
              number: 3000

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: taskflow-app-hpa
  namespace: taskflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: taskflow-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
